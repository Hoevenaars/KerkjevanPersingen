name: Sanity Studio deployen

# Draait automatisch zodra er iets wijzigt in de schema-bestanden op main, en is
# ook met de hand te starten via het tabblad "Actions" in GitHub. Dit vervangt
# `npx sanity deploy` vanaf de eigen computer — er is geen terminal voor nodig.
on:
  push:
    branches: [main]
    paths:
      - 'sanity/**'
      - 'sanity.config.ts'
      - '.github/workflows/sanity-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencies installeren
        run: npm install

      - name: Studio deployen naar Sanity
        run: npx sanity deploy --yes
        env:
          # Zonder deze token kan de Action niet inloggen bij Sanity.
          # Toevoegen bij: repo → Settings → Secrets and variables → Actions.
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
