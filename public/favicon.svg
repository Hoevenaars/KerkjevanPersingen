<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kerkje van Persingen">
  <title>Kerkje van Persingen</title>
  <!--
    Klein beeldmerk, afgeleid van het zegel.

    Het volledige zegel met cirkeltekst is onleesbaar op 16 pixels: de ring wordt een
    grijze vlek. Dit is dezelfde silhouet — hoge smalle toren met spits en kruis, lager
    schip met zadeldak — teruggebracht tot massieve vlakken. Detail dat op tabblad-formaat
    alleen ruis oplevert (de lage aanbouw, de bomen) is bewust weggelaten.
  -->
  <circle cx="32" cy="32" r="32" fill="#4A5235"/>

  <g fill="#FAF8F3">
    <rect x="30.9" y="5.5" width="2.2" height="7.5" rx="0.7"/>
    <rect x="28.2" y="8.2" width="7.6" height="2.2" rx="0.7"/>
    <path d="M32 12 L38.5 26 L25.5 26 Z"/>
    <path d="M26 26 H38 V52 H26 Z"/>
    <path d="M38 31.5 L46 31.5 L54 39.5 V52 H38 Z"/>
    <rect x="5" y="52" width="54" height="2.6" rx="1.3"/>
  </g>

  <g fill="#4A5235">
    <rect x="28.9" y="31" width="2.4" height="5" rx="1.2"/>
    <rect x="32.7" y="31" width="2.4" height="5" rx="1.2"/>
    <path d="M44 41.5 a2.4 2.4 0 0 1 4.8 0 v6.5 h-4.8 Z"/>
  </g>
</svg>
